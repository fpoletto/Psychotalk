[package]
name = "psychotalk-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
probe-diagnostics = []

[dependencies]
anyhow = "1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
base64 = "0.22"
data-encoding = "2"
hex = "0.4"
libc = "0.2.191"
rand = "0.8"
rcgen = "0.14"
rusqlite = { version = "0.42.0", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"

[dev-dependencies]
tempfile = "3"
